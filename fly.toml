# fly.toml — Fly.io configuration for the finmat agent
# Worker process: no HTTP server, no ports, just a long-running scheduler.

app = "finmat"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  TZ       = "Europe/Dublin"
  LOG_DIR  = "/data/logs"

# Persistent volume for portfolio history and trade log.
# Create once with: fly volumes create finmat_data --region ams --size 1
[[mounts]]
  source      = "finmat_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
