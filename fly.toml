# fly.toml — Fly.io configuration for the finmat agent
# Runs the scheduler (main.py) + Flask dashboard (ui/app.py) on port 5001.

app = "finmat"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  TZ       = "Europe/Dublin"
  LOG_DIR  = "/data/logs"

# Persistent volume for portfolio history and trade log.
# Create once with: fly volumes create finmat_data --region ams --size 1
[[mounts]]
  source      = "finmat_data"
  destination = "/data"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
