name: Dev Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -m "not integration" -q
