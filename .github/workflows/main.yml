name: Main CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  all-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q

  docker-build:
    runs-on: ubuntu-latest
    needs: all-tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
